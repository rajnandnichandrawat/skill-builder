<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Login | Skill Builder</title>

    <!-- CSS -->

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
<body>



    <!-- ================= LOGIN SECTION ================= -->

    <section class="login-section">

        <div class="login-box">

            <h1>
                Welcome Back
            </h1>

            <p>
                Login to continue learning skills.
            </p>



            <form id="login-form">

                <!-- NAME -->

                <input type="text"
                placeholder="Enter your name"
                required>



                <!-- EMAIL -->

                <input type="email"
                placeholder="Enter your email"
                required>



                <!-- PASSWORD -->

                <input type="password"
                placeholder="Enter your password"
                required>



                <!-- BUTTON -->

                <button type="submit">

                    Login

                </button>

            </form>

        </div>

    </section>



    <!-- JavaScript -->

    <script src="script.js"></script>

</body>
</html>
